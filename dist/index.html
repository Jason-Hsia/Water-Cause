<div class="app">

      <article class="stat"><label>在线监测点</label><div class="value"><strong id="stationCount">24</strong><small>23 正常</small></div></article>
      <article class="stat"><label>待研判事件</label><div class="value"><strong class="warn" id="eventCount">3</strong><small>1 个高风险</small></div></article>
      <article class="stat"><label>数据完整率</label><div class="value"><strong>96.8%</strong><small>过去 24h</small></div></article>
      <article class="stat"><label>平均研判耗时</label><div class="value"><strong>4.2</strong><small>分钟 / 事件</small></div></article>

    <section class="workspace">
      <div class="panel">
        <div class="panel-head"><div><h2>关键指标与异常窗口</h2><p id="chartMeta">中心断面 W07 · 2026-09-21</p></div><div class="seg" role="group" aria-label="图表指标"><button class="active" data-metric="tp">总磷</button><button data-metric="nh3n">氨氮</button><button data-metric="cod">COD</button></div></div>
        <div class="chart-wrap"><div class="chart-legend"><span class="key" id="metricLabel">总磷 mg/L</span><span class="key rain">降雨 mm</span><span class="key limit">参考阈值</span></div><svg id="chart" role="img" aria-label="过去二十四小时水质指标和降雨趋势"></svg></div>

<div class="notice" id="notice" role="status"></div>
<script>
const demo = {
  series: Array.from({length:24},(_,i)=>({hour:i,tp:+(0.17+Math.sin(i/3)*.018+(i>15&&i<20?(i-15)*.065:0)).toFixed(3),nh3n:+(0.48+Math.sin(i/2.4)*.07+(i>17?0.12:0)).toFixed(2),cod:+(13+Math.sin(i/2)*1.2+(i>15&&i<20?(i-15)*2.4:0)).toFixed(1),rain:i>13&&i<18?[2,6,14,10][i-14]:0})),
  events:[
    {id:'EV-0921-03',time:'18:40',site:'中心断面 W07',summary:'总磷与浊度同步快速上升',risk:'高风险',confidence:82,metric:'tp',causes:[['上游农业面源冲刷',62,'强降雨后传播时滞、颗粒态污染特征与历史事件一致'],['雨污混接或溢流',24,'降雨窗口匹配，但氨氮响应弱于典型生活污水'],['工业点源异常排放',9,'空间可达但排污指纹与事件不完全一致']],evidence:['16:00—18:00 上游累计降雨 32 mm','总磷与浊度相关系数 0.87','W03 → W07 水力传播时间约 2.3 小时'],action:'下一轮降雨开始后 60 分钟内，在北支沟、东圩沟和 W05 采集颗粒态磷、溶解态磷、悬浮物与浊度样品。'},
    {id:'EV-0921-02',time:'03:20',site:'园区下游 W12',summary:'氨氮夜间阶跃式升高',risk:'中风险',confidence:76,metric:'nh3n',causes:[['污水管网混接或渗漏',51,'夜间低流量时浓度升高，氨氮与电导率同步响应'],['生活污水短时溢流',31,'污染指纹匹配，但缺少泵站液位记录'],['水体底泥释放',11,'温度与溶解氧变化不足以解释阶跃特征']],evidence:['02:40 起氨氮在 40 分钟内上升 68%','同期无降雨且上游断面保持稳定','下游电导率同步增加 13%'],action:'优先核查园区东侧管网液位和 2 号泵站运行记录，并在 YP-06、YP-09 排口补采氨氮与电导率。'},
    {id:'EV-0920-07',time:'昨天 21:10',site:'入湖口 W19',summary:'COD 持续偏离季节基线',risk:'中风险',confidence:69,metric:'cod',causes:[['城镇生活源累积输入',45,'日变化周期和上下游增量均符合生活源特征'],['水生植物腐解',29,'季节与水温条件匹配，需增加 DOC 光谱证据'],['小型食品加工点源',17,'历史曾有相似事件，但当前企业工况未知']],evidence:['连续 9 小时高于近 30 日同小时基线','W15—W19 COD 净增量 4.8 mg/L','高锰酸盐指数同步升高'],action:'在 W15、支流 S4、W19 做上下游同步采样，并核查沿线食品加工企业当天生产与污水处理记录。'}
  ]
};
let model=structuredClone(demo), activeId=model.events[0].id, metric='tp';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function niceMetric(m){return {tp:['总磷','mg/L',.3],nh3n:['氨氮','mg/L',1],cod:['COD','mg/L',20]}[m]}
function renderChart(){
  const svg=$('#chart'), box=svg.getBoundingClientRect(), w=Math.max(320,box.width),h=box.height||245,p={l:42,r:16,t:16,b:30}; svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
  const vals=model.series.map(d=>d[metric]), rains=model.series.map(d=>d.rain||0), max=Math.max(...vals,niceMetric(metric)[2])*1.2, rainMax=Math.max(...rains,1), x=i=>p.l+i*(w-p.l-p.r)/(vals.length-1), y=v=>h-p.b-v*(h-p.t-p.b)/max;
  let out=`<rect x="${p.l}" y="${p.t}" width="${w-p.l-p.r}" height="${h-p.t-p.b}" fill="#f7f7f7"/>`;
  for(let i=0;i<5;i++){const yy=p.t+i*(h-p.t-p.b)/4,v=(max*(4-i)/4).toFixed(metric==='cod'?0:2);out+=`<line x1="${p.l}" y1="${yy}" x2="${w-p.r}" y2="${yy}" stroke="#cccccc"/><text x="${p.l-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="#757575">${v}</text>`}
  rains.forEach((v,i)=>{if(v)out+=`<rect x="${x(i)-5}" y="${h-p.b-v*(h-p.t-p.b)*.42/rainMax}" width="10" height="${v*(h-p.t-p.b)*.42/rainMax}" fill="#898989" opacity=".35"/>`});
  const limit=niceMetric(metric)[2];out+=`<line x1="${p.l}" y1="${y(limit)}" x2="${w-p.r}" y2="${y(limit)}" stroke="#d75d54" stroke-dasharray="5 5"/>`;
  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');out+=`<polyline points="${pts}" fill="none" stroke="#76b900" stroke-width="3" stroke-linejoin="miter"/>`;
  vals.forEach((v,i)=>{if(i%3===0||v>limit)out+=`<circle cx="${x(i)}" cy="${y(v)}" r="${v>limit?4:2.5}" fill="${v>limit?'#e52020':'#76b900'}"><title>${i}:00 · ${v} ${niceMetric(metric)[1]}</title></circle>`});
  [0,6,12,18,23].forEach(i=>out+=`<text x="${x(i)}" y="${h-9}" text-anchor="middle" font-size="11" fill="#757575">${String(i).padStart(2,'0')}:00</text>`);svg.innerHTML=out;$('#metricLabel').textContent=`${niceMetric(metric)[0]} ${niceMetric(metric)[1]}`;
}
function renderEvents(){
  $('#eventList').innerHTML=model.events.length?model.events.map(e=>`<button class="event-row ${e.id===activeId?'active':''}" data-id="${e.id}"><span class="time">${e.time}</span><span><strong>${e.site}</strong><p>${e.summary}</p></span><span class="tag ${e.risk==='高风险'?'high':''}">${e.risk}</span><span class="confidence">${e.confidence}%</span></button>`).join(''):'<div class="empty">未检测到明显异常事件</div>';
  $$('.event-row').forEach(b=>b.addEventListener('click',()=>{activeId=b.dataset.id;const e=model.events.find(x=>x.id===activeId);metric=e.metric;syncMetric();renderAll()}));
}
function renderDetail(){
  const e=model.events.find(x=>x.id===activeId);if(!e){$('#detail').innerHTML='<div class="empty">请选择异常事件</div>';return}
  const verified=JSON.parse(localStorage.getItem('verifiedEvents')||'[]').includes(e.id);
  $('#detail').innerHTML=`<div class="event-title"><div><h2>${e.summary}</h2><p>${e.id} · ${e.site} · ${e.time}</p></div><div class="score-ring"><b>${e.confidence}%</b></div></div><div class="section-title">候选成因排序</div>${e.causes.map(c=>`<div class="cause"><div class="cause-top"><b>${c[0]}</b><b>${c[1]}%</b></div><div class="bar"><i style="width:${c[1]}%"></i></div><p>${c[2]}</p></div>`).join('')}<div class="section-title">关键证据</div><div class="evidence">${e.evidence.map((x,i)=>`<div><b>${i+1}</b>　${x}</div>`).join('')}</div><div class="recommend"><label>建议核查动作</label><p>${e.action}</p></div><div class="detail-actions"><button class="btn primary" id="verifyBtn">${verified?'已完成现场核查':'标记为已核查'}</button><button class="btn" id="reportBtn">导出事件报告</button></div>`;
  $('#verifyBtn').onclick=()=>{let ids=JSON.parse(localStorage.getItem('verifiedEvents')||'[]');if(!ids.includes(e.id))ids.push(e.id);localStorage.setItem('verifiedEvents',JSON.stringify(ids));toast('核查状态已保存到本机');renderDetail()};
  $('#reportBtn').onclick=()=>downloadReport(e);
}
function renderAll(){renderEvents();renderDetail();renderChart();$('#eventCount').textContent=model.events.length}
function syncMetric(){$$('.seg button').forEach(b=>b.classList.toggle('active',b.dataset.metric===metric))}
function toast(s){const n=$('#notice');n.textContent=s;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),2200)}
function downloadReport(e){const txt=`源析水智 · 水质异常研判报告\n\n事件：${e.id}\n点位：${e.site}\n时间：${e.time}\n异常：${e.summary}\n综合置信度：${e.confidence}%\n\n候选成因\n${e.causes.map((c,i)=>`${i+1}. ${c[0]}（${c[1]}%）\n   ${c[2]}`).join('\n')}\n\n关键证据\n${e.evidence.map((x,i)=>`${i+1}. ${x}`).join('\n')}\n\n建议核查动作\n${e.action}\n\n说明：本报告为辅助研判结果，不能替代规范监测、现场检查或行政执法证据。`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));a.download=`${e.id}-研判报告.txt`;a.click();URL.revokeObjectURL(a.href)}
function parseCSV(text){
  const rows=text.trim().split(/\r?\n/).map(r=>r.split(',').map(x=>x.trim()));if(rows.length<3)throw Error('至少需要两行数据');const head=rows.shift().map(x=>x.toLowerCase());const req=['timestamp','tp','nh3n','cod'];req.forEach(k=>{if(!head.includes(k))throw Error(`缺少字段 ${k}`)});
  const data=rows.map(r=>Object.fromEntries(head.map((k,i)=>[k,r[i]]))).map((d,i)=>({hour:i,tp:+d.tp,nh3n:+d.nh3n,cod:+d.cod,rain:+(d.rainfall||d.rain||0),station:d.station||'导入断面'})).filter(d=>Number.isFinite(d.tp)&&Number.isFinite(d.nh3n)&&Number.isFinite(d.cod));if(data.length<2)throw Error('有效数据不足');
  const defs={tp:['总磷异常升高',.3],nh3n:['氨氮异常升高',1],cod:['COD 异常升高',20]}, events=[];Object.entries(defs).forEach(([k,[label,limit]],i)=>{const peak=Math.max(...data.map(d=>d[k]));if(peak>limit)events.push({id:`CSV-${String(i+1).padStart(2,'0')}`,time:'导入数据',site:data[0].station,summary:label,risk:peak>limit*1.5?'高风险':'中风险',confidence:Math.min(91,Math.round(60+20*(peak/limit-1))),metric:k,causes:[['需结合源清单进一步研判',55,'指标超过参考阈值，当前导入数据缺少排污口和水文空间关系'],['监测设备或采样异常',23,'需要通过邻近点位和设备质控记录排除'],['自然过程扰动',14,'需补充降雨、流量、水温和溶解氧数据']],evidence:[`${niceMetric(k)[0]}峰值 ${peak} ${niceMetric(k)[1]}`,`参考阈值 ${limit} ${niceMetric(k)[1]}`,`共导入 ${data.length} 条有效记录`],action:'补充点位坐标、上下游关系、降雨流量和潜在污染源台账后重新研判；同时复核峰值时段的设备质控记录。'})});return {series:data.slice(-24),events}
}
$('#csvInput').addEventListener('change',async e=>{try{model=parseCSV(await e.target.files[0].text());activeId=model.events[0]?.id;metric=model.events[0]?.metric||'tp';$('#subtitle').textContent=`本地 CSV · ${model.series.length} 条记录 · 未上传服务器`;$('#stationCount').textContent=new Set(model.series.map(x=>x.station)).size;syncMetric();renderAll();toast(`已识别 ${model.events.length} 个异常事件`)}catch(err){toast(`导入失败：${err.message}`)}finally{e.target.value=''}});
$('#templateBtn').onclick=()=>{const rows=['timestamp,station,tp,nh3n,cod,rainfall','2026-09-21 16:00,W07,0.18,0.51,13.2,2','2026-09-21 17:00,W07,0.24,0.55,15.1,14','2026-09-21 18:00,W07,0.38,0.59,21.6,10'];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='water-quality-template.csv';a.click();URL.revokeObjectURL(a.href)};
$('#resetBtn').onclick=()=>{model=structuredClone(demo);activeId=model.events[0].id;metric='tp';$('#subtitle').textContent='青浦示范河网 · 最近 24 小时 · 演示数据';$('#stationCount').textContent='24';syncMetric();renderAll();toast('已恢复演示数据')};
$$('.seg button').forEach(b=>b.onclick=()=>{metric=b.dataset.metric;syncMetric();renderChart()});
window.addEventListener('resize',renderChart);renderAll();
(function registerTools(){const mc=document.modelContext;if(!mc?.registerTool)return;try{mc.registerTool({name:'read_water_quality_event',title:'读取水质事件研判',description:'按事件编号读取候选成因、证据和现场核查建议。',inputSchema:{type:'object',properties:{eventId:{type:'string'}},required:['eventId'],additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute({eventId}){const e=model.events.find(x=>x.id===eventId);if(!e)throw Error('未找到事件');return {id:e.id,site:e.site,summary:e.summary,confidence:e.confidence,causes:e.causes,evidence:e.evidence,recommendedAction:e.action}}})}catch{}})();
</script>
</body>
